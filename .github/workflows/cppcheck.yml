name: Run Cppcheck

on:
  pull_request:
  push:
  schedule:
    - cron: '0 2 * * 5'  # Every Friday at 2am
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Run Cppcheck
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Build and install Cppcheck (less than 2 minutes)
      run: |
        commit=e73bf44c3e49686b7495fab352d03a6c6075516b  # 2.21.0

        cmake_args=(
            -G Ninja  # for faster builds
            -DCMAKE_BUILD_TYPE=Release  # for runtime performance
        )
        set -x

        git init -b main cppcheck/

        pushd cppcheck/
          git fetch --depth 1 https://github.com/cppcheck-opensource/cppcheck "${commit}"
          git -c advice.detachedHead=false checkout FETCH_HEAD
        popd

        cmake "${cmake_args[@]}" -S cppcheck/ -B build/

        cmake --build build/ --parallel "$(nproc)"

        sudo cmake --install build/

        rm -Rf cppcheck/ build/

        # Smoke-test installed version
        [[ $(type -P cppcheck) == /usr/local/bin/cppcheck ]]
        cppcheck --version

    - name: Run Cppcheck (less than 6 minutes)
      run: |
        exec .github/workflows/scripts/mass-cppcheck.sh

name: Compile and test with Clang-based MinGW

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mingw_clang:
    name: Clang MinGW ASan + Wine (${{ matrix.expat_char_type }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The tested Ubuntu 26.04 Wine binaries use ENDBR64 at functions that
    # compiler-rt 22's Windows interceptor cannot decode.  Debian 13 works.
    container: debian:13-slim
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        expat_char_type:
          - char
          - wchar_t
    env:
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=0
      LLVM_MINGW_SHA256: 534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda
      LLVM_MINGW_VERSION: '20260616'
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      WINEARCH: win64
      WINEDEBUG: -all
      # Job containers run as root, but the workspace bind mount is runner-owned.
      # Wine rejects a prefix below a directory owned by another user.
      WINEPREFIX: /tmp/libexpat-wineprefix

    steps:
    - name: Install build and runtime dependencies
      run: |-
        set -x
        apt-get update
        apt-get install --yes --no-install-recommends -V \
            ca-certificates \
            cmake \
            git \
            make \
            ninja-build \
            python3 \
            wget \
            wine \
            wine64 \
            xz-utils
        wine --version

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install the Clang-based MinGW toolchain
      run: |-
        llvm_mingw_dir="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
        llvm_mingw_tarball="${llvm_mingw_dir}.tar.xz"
        llvm_mingw_url="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${llvm_mingw_tarball}"
        set -x
        wget --progress=dot:giga "${llvm_mingw_url}"
        printf '%s  %s\n' "${LLVM_MINGW_SHA256}" "${llvm_mingw_tarball}" \
            | sha256sum --check --strict
        tar -xf "${llvm_mingw_tarball}"
        echo "${GITHUB_WORKSPACE}/${llvm_mingw_dir}/bin" >> "${GITHUB_PATH}"
        echo "LLVM_MINGW_DIR=${GITHUB_WORKSPACE}/${llvm_mingw_dir}" >> "${GITHUB_ENV}"

    - name: Configure
      env:
        EXPAT_CHAR_TYPE: ${{ matrix.expat_char_type }}
      run: |-
        sanitizer_compile_flags='-Wall -Wextra -pedantic -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -fno-common'
        sanitizer_link_flags='-g -fsanitize=address,undefined'
        cmake_args=(
            -G Ninja
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-toolchain-win64.cmake
            "-DCMAKE_C_FLAGS=${sanitizer_compile_flags}"
            "-DCMAKE_CXX_FLAGS=${sanitizer_compile_flags}"
            "-DCMAKE_EXE_LINKER_FLAGS=${sanitizer_link_flags}"
            "-DCMAKE_MODULE_LINKER_FLAGS=${sanitizer_link_flags}"
            "-DCMAKE_SHARED_LINKER_FLAGS=${sanitizer_link_flags}"
            -DEXPAT_BUILD_DOCS=OFF
            -DEXPAT_BUILD_EXAMPLES=OFF
            -DEXPAT_BUILD_PKGCONFIG=OFF
            -DEXPAT_BUILD_TESTS=ON
            -DEXPAT_BUILD_TOOLS=ON
            -DEXPAT_WARNINGS_AS_ERRORS=ON
            "-DEXPAT_CHAR_TYPE=${EXPAT_CHAR_TYPE}"
        )
        set -x
        x86_64-w64-mingw32-gcc --version
        cmake "${cmake_args[@]}" -S expat -B build

    - name: Build and stage Windows runtime DLLs
      run: |-
        set -x
        cmake --build build --parallel "$(nproc)" --verbose

        runtime_dll_dir="${LLVM_MINGW_DIR}/x86_64-w64-mingw32/bin"
        runtime_dlls=(
            libc++.dll
            libclang_rt.asan_dynamic-x86_64.dll
            libunwind.dll
        )
        for runtime_dll in "${runtime_dlls[@]}"; do
            cp -v "${runtime_dll_dir}/${runtime_dll}" build/tests/
            cp -v "${runtime_dll_dir}/${runtime_dll}" build/xmlwf/
        done
        cp -v build/libexpat*-1.dll build/xmlwf/

    - name: Initialize the 64-bit Wine prefix
      run: |-
        set -x
        timeout 60s wineboot --init
        wineserver --wait

    - name: Run unit tests under ASan and Wine
      run: |-
        set -x
        ctest --test-dir build --output-on-failure --timeout 300
        wineserver --wait

    - name: Smoke-test xmlwf and its staged DLLs
      run: |-
        printf '<document><item/></document>\n' > build/xmlwf/smoke.xml
        set -x
        pushd build/xmlwf
        timeout 60s wine ./xmlwf.exe smoke.xml
        popd
        wineserver --wait

    - name: Prove that ASan catches a heap buffer overflow
      run: |-
        set -x
        x86_64-w64-mingw32-gcc \
            -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer -fno-common \
            .github/workflows/scripts/asan-heap-overflow.c \
            -o build/tests/asan-heap-overflow.exe

        set +e
        timeout 60s wine build/tests/asan-heap-overflow.exe \
            > build/tests/asan-heap-overflow.log 2>&1
        asan_exit_code=$?
        set -e

        sed -n '1,160p' build/tests/asan-heap-overflow.log
        test "${asan_exit_code}" -ne 0
        grep -Fq 'ERROR: AddressSanitizer: heap-buffer-overflow' \
            build/tests/asan-heap-overflow.log
        wineserver --wait

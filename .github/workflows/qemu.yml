name: Build and test with QEMU

on:
  pull_request:
  push:
  schedule:
    - cron: '0 2 * * 5'  # Every Friday at 2am
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu:
    name: Build and test on ${{ matrix.platform }} (emulated)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - riscv64  # little-endian
          - s390x    # big-endian
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      with:
        platforms: ${{ matrix.platform }}

    - name: Build and run the test suite on ${{ matrix.platform }} in a container
      env:
        platform: ${{ matrix.platform }}
      run: |
        docker run \
            --platform "linux/${platform}" \
            --rm \
            --volume "${PWD}:/workspace" \
            --workdir /workspace \
            debian:trixie-slim \
            bash -c '
          set -e -u -x

          uname -m

          apt-get update
          timeout 10m apt-get install --yes --no-install-recommends -V \
              ca-certificates \
              cmake \
              g++ \
              gcc \
              make \
              python3 \
              unzip \
              wget

          cmake_args=(
            -DCMAKE_{C,CXX}_FLAGS="-O1 -pipe -Wall -Wextra -pedantic -Wno-overlength-strings"
            -DEXPAT_BUILD_DOCS=OFF
            -DEXPAT_WARNINGS_AS_ERRORS=ON
          )
          cmake "${cmake_args[@]}" -S expat/ -B build/
          make -C build -j$(nproc) VERBOSE=1 all

          make -C build/ test run-xmltest
        '
